[project]
name = "nana-agent"
version = "0.1.0"
description = "NanaShop Agent - 电商客服多轮对话 Agent"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0",
    "gradio>=4.40.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
