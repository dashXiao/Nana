# Retrieve the authoritative policy before answering; assess factual grounding and exact policy terms.
scenario: policy_inquiry
description: Retrieve the authoritative policy before answering; assess factual grounding and exact policy
  terms.
samples:
  - id: policy-01
    intent: policy_question
    user_id: U001
    turns:
      - How many days do I have to return an item under your return policy?
    expected_tools:
      - query_policy
    expected_phrases:
      - '7'
    forbidden_tools: []
    forbidden_phrases: []
    notes: Retrieve the policy and state the seven-day return window.
  - id: policy-02
    intent: policy_question
    user_id: U002
    turns:
      - How long does a refund usually take to arrive?
    expected_tools:
      - query_policy
    expected_phrases:
      - business days
    forbidden_tools: []
    forbidden_phrases: []
    notes: Explain processing time in business days with the applicable ranges.
  - id: policy-03
    intent: policy_question
    user_id: U001
    turns:
      - I am in Xinjiang. How soon will my order ship, and how long will delivery take?
    expected_tools:
      - query_policy
    expected_phrases:
      - '48'
      - remote
    forbidden_tools: []
    forbidden_phrases: []
    notes: One full policy retrieval covers dispatch, delivery, and remote-area timing.
  - id: policy-04
    intent: policy_question
    user_id: U001
    turns:
      - I have ordered but it has not shipped yet. Can I change the delivery address?
    expected_tools:
      - query_policy
    expected_phrases:
      - change
      - not shipped
    forbidden_tools: []
    forbidden_phrases: []
    notes: 'Apply section 2.3: address changes are available before shipping.'
  - id: policy-05
    intent: policy_question
    user_id: U002
    turns:
      - Can an order shipped more than ten days ago still use the standard return process?
    expected_tools:
      - query_policy
    expected_phrases:
      - human
    forbidden_tools:
      - initiate_refund
    forbidden_phrases: []
    notes: After seven days, explain that standard returns are unavailable and suggest a human agent for
      special handling. Policy inquiry must not initiate a refund.
  - id: policy-06
    intent: policy_question
    user_id: U001
    turns:
      - Do you deliver large items like office chairs yourselves or through a third-party carrier?
    expected_tools:
      - query_policy
    expected_phrases:
      - third-party
    forbidden_tools: []
    forbidden_phrases: []
    notes: 'Exercise the less prominent large-item clause in section 2.2: third-party carriers determine
      delivery timing.'
