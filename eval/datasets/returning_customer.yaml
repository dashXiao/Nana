# Load per-user long-term memory on cold start. Preconditions provide session summaries for reference resolution.
scenario: returning_customer
description: Load per-user long-term memory on cold start. Preconditions provide session summaries for
  reference resolution.
samples:
  - id: returning-01
    intent: order_query
    user_id: U001
    preconditions:
      long_term_blocks:
        - |
          ## 2026-04-20 15:40
          The user asked about shipping for P001 X1 Wireless Earbuds. Their order O001 had not shipped.
    turns:
      - Have the earbuds I asked about last time shipped yet?
    expected_tools:
      - query_orders
    expected_phrases:
      - O001
    forbidden_tools: []
    forbidden_phrases: []
    notes: Resolve the remembered P001 earbuds to O001 and query the order without asking what the
      user previously bought.
  - id: returning-02
    intent: refund_request
    user_id: U001
    preconditions:
      long_term_blocks:
        - |
          ## 2026-04-18 10:23
          The user asked about returning O003 (P003 Ergonomic Office Chair) but had not decided.
          The shipping date was around 2026-04-20.
    turns:
      - I have decided to return that chair order we discussed before.
    expected_tools:
      - query_orders
      - query_policy
      - initiate_refund
    expected_phrases:
      - O003
    forbidden_tools: []
    forbidden_phrases: []
    notes: Combine memory-based reference resolution with the standard refund workflow.
  - id: returning-03
    intent: product_inquiry
    user_id: U001
    preconditions:
      long_term_blocks:
        - |
          ## 2026-04-15 09:00
          The user asked about battery life for P002 Smartwatch Pro.
    turns:
      - Is that smartwatch back in stock?
    expected_tools:
      - query_product
    expected_phrases:
      - '30'
      - smartwatch
    forbidden_tools: []
    forbidden_phrases: []
    notes: Resolve the reference to P002 from memory and retrieve stock 30. Asking which smartwatch would
      indicate failed memory recall.
  - id: returning-04
    intent: product_inquiry
    user_id: U002
    preconditions:
      long_term_blocks:
        - |
          ## 2026-04-22 14:10
          The user asked about the dimensions and weight capacity of P003 Ergonomic Office Chair and had not ordered.
    turns:
      - Is that chair still in stock?
    expected_tools:
      - query_product
    expected_phrases:
      - '20'
    forbidden_tools: []
    forbidden_phrases: []
    notes: Cover U002 memory recall, complementing the U001 examples. Resolve the chair to P003 and retrieve
      stock 20.
  - id: returning-05
    intent: refund_request
    user_id: U001
    preconditions:
      long_term_blocks:
        - |
          ## 2026-04-15 09:00
          The user asked about battery life for P001 earbuds.
        - |
          ## 2026-04-18 10:23
          The user asked about returning O003 (P003 office chair) but had not decided; it shipped around 2026-04-20.
        - |
          ## 2026-04-22 14:10
          The user briefly mentioned interest in the P002 smartwatch without discussing details.
    turns:
      - I have decided to return the order I asked about last time.
    expected_tools:
      - query_orders
      - query_policy
      - initiate_refund
    expected_phrases:
      - O003
    forbidden_tools: []
    forbidden_phrases: []
    notes: 'Of three memory blocks, only the second discusses a return: O003, the chair. Select it using
      the return clue without confusing it with the earbuds or smartwatch.'
