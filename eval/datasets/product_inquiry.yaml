# Map product names to catalog IDs; retrieve DB fields and full Markdown descriptions. Prices and stock: P001 299/50, P002 899/30, P003 1299/20.
scenario: product_inquiry
description: 'Map product names to catalog IDs; retrieve DB fields and full Markdown descriptions. Prices
  and stock: P001 299/50, P002 899/30, P003 1299/20.'
samples:
  - id: product-01
    intent: product_inquiry
    user_id: U001
    turns:
      - How long does the X1 earbud battery last, and is it in stock?
    expected_tools:
      - query_product
    expected_phrases:
      - '50'
    forbidden_tools: []
    forbidden_phrases: []
    notes: Resolve X1 earbuds to P001 using the catalog patch, then retrieve product details. Assert
      stock 50; the judge checks battery claims against P001.md.
  - id: product-02
    intent: product_inquiry
    user_id: U002
    turns:
      - How much is the Smartwatch Pro?
    expected_tools:
      - query_product
    expected_phrases:
      - '899'
    forbidden_tools: []
    forbidden_phrases: []
    notes: A direct price query must retrieve product data rather than rely on memory.
  - id: product-03
    intent: product_inquiry
    user_id: U001
    turns:
      - What are the prices of the office chair and the earbuds?
    expected_tools:
      - query_product
    expected_phrases:
      - '299'
      - '1299'
    forbidden_tools: []
    forbidden_phrases: []
    notes: Retrieve multiple products in one query_product call using a product_ids list.
  - id: product-04
    intent: product_inquiry
    user_id: U002
    turns:
      - Does the smartwatch support eSIM? What is its battery capacity in mAh?
    expected_tools:
      - query_product
    expected_phrases: []
    forbidden_tools: []
    forbidden_phrases: []
    notes: 'P002.md specifies neither eSIM support nor battery capacity in mAh. Acknowledge missing information
      without inventing it. Leave phrase checks empty: even a correct disclaimer can contain mAh. The
      judge assesses faithfulness.'
  - id: product-05
    intent: product_inquiry
    user_id: U001
    turns:
      - Do you sell phone cases?
    expected_tools: []
    expected_phrases: []
    forbidden_tools: []
    forbidden_phrases:
      - P004
      - P005
      - temporarily out of stock
      - discontinued
    notes: Only P001/P002/P003 exist. The catalog allows a direct answer that phone cases are not sold;
      an optional catalog-wide query is acceptable. Do not invent IDs or claim the product is temporarily
      unavailable or discontinued.
  - id: product-06
    intent: product_inquiry
    user_id: U002
    turns:
      - Which is better value, the X1 earbuds or the Smartwatch Pro?
    expected_tools:
      - query_product
    expected_phrases:
      - '299'
      - '899'
    forbidden_tools: []
    forbidden_phrases: []
    notes: Retrieve both products and compare using actual prices, 299 and 899. Recommendation preference
      is open-ended and judged for helpfulness.
