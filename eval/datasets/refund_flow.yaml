# Resolve natural order references, retrieve orders and policy, then refund only eligible orders. Cover pending, in-window, expired, already-refunded, ambiguous, and nonexistent orders.
scenario: refund_flow
description: Resolve natural order references, retrieve orders and policy, then refund only eligible orders.
  Cover pending, in-window, expired, already-refunded, ambiguous, and nonexistent orders.
samples:
  - id: refund-01
    intent: refund_request
    user_id: U001
    turns:
      - Please refund the order I just placed most recently.
    expected_tools:
      - query_orders
      - query_policy
      - initiate_refund
    expected_phrases:
      - refund
    forbidden_tools: []
    forbidden_phrases: []
    notes: Resolve the latest order to O001 (pending, placed today) from the newest-first order list.
      Never invent an ID. The unshipped order is eligible for a refund.
  - id: refund-02
    intent: refund_request
    user_id: U001
    turns:
      - I would like to return the order with the ergonomic chair.
    expected_tools:
      - query_orders
      - query_policy
      - initiate_refund
    expected_phrases:
      - refund
    forbidden_tools: []
    forbidden_phrases: []
    notes: Resolve the product reference to O003, shipped two days ago. Retrieve policy and initiate the
      eligible refund.
  - id: refund-03
    intent: refund_request
    user_id: U001
    turns:
      - I would like to return the smartwatch I ordered a little over a week ago.
    expected_tools:
      - query_orders
      - query_policy
    expected_phrases:
      - smartwatch
    forbidden_tools:
      - initiate_refund
    forbidden_phrases:
      - refund successful
      - I have refunded
    notes: Resolve to O005, delivered and shipped nine days ago. Explain the seven-day policy and suggest
      human support; do not call initiate_refund. This checks model-side policy enforcement.
  - id: refund-04
    intent: refund_request
    user_id: U001
    turns:
      - Can you refund the earbud order that was already refunded once?
    expected_tools:
      - query_orders
    expected_phrases:
      - already been refunded
    forbidden_tools:
      - initiate_refund
    forbidden_phrases:
      - refund successful
    notes: Resolve to refunded O007. Report that it is already refunded after querying orders; do not
      initiate a second refund.
  - id: refund-05
    intent: refund_request
    user_id: U001
    turns:
      - I no longer want the chair I bought last time.
      - Yes, return it.
    expected_tools:
      - query_orders
      - query_policy
      - initiate_refund
    expected_phrases:
      - refund
    forbidden_tools: []
    forbidden_phrases: []
    notes: Exercise multi-turn reference resolution to O003. The agent may proceed immediately or confirm
      first, but must complete an eligible refund consistently.
  - id: refund-06
    intent: refund_request
    user_id: U002
    turns:
      - My smartwatch order has not shipped. Please refund it.
    expected_tools:
      - query_orders
      - query_policy
      - initiate_refund
    expected_phrases:
      - refund
    forbidden_tools: []
    forbidden_phrases: []
    notes: 'U002 happy path: O002 is a pending P002 order. This prevents overfitting to U001-only order
      shapes.'
  - id: refund-07
    intent: refund_request
    user_id: U001
    turns:
      - Please refund my earbud order.
    expected_tools:
      - query_orders
    expected_phrases:
      - O001
    forbidden_tools: []
    forbidden_phrases:
      - I have refunded O007
      - refund O007 again
      - refund again
    notes: 'Ambiguous reference: U001 has pending O001 and refunded O007. Select the active order or ask
      for clarification; expose O001 in either path. Never treat O007 as eligible for a repeat refund.'
  - id: refund-08
    intent: refund_request
    user_id: U001
    turns:
      - I want to return the camera I bought a few days ago.
    expected_tools:
      - query_orders
    expected_phrases: []
    forbidden_tools:
      - initiate_refund
    forbidden_phrases:
      - has been refunded
      - refund successful
      - I have initiated a refund
    notes: U001 has no camera orders; the catalog contains only earbuds, a smartwatch, and an office
      chair. Query orders, explain or clarify, and never invent a refund.
