# Greetings and out-of-scope requests should not trigger unrelated tools or unsolicited feature menus.
scenario: chitchat_other
description: Greetings and out-of-scope requests should not trigger unrelated tools or unsolicited feature
  menus.
samples:
  - id: ch-01
    intent: chitchat
    user_id: U001
    turns:
      - Hello
    expected_tools: []
    expected_phrases:
      - Hello
    forbidden_tools:
      - query_orders
      - query_product
      - query_policy
      - initiate_refund
      - escalate_to_human
    forbidden_phrases:
      - available features
      - I can help you with
      - you can ask about
    notes: Give a short greeting without tools or unsolicited feature menus; forbidden phrases guard against
      prompt drift.
  - id: ch-02
    intent: chitchat
    user_id: U002
    turns:
      - Thank you for your help.
    expected_tools: []
    expected_phrases: []
    forbidden_tools:
      - query_orders
      - query_product
      - query_policy
      - initiate_refund
      - escalate_to_human
    forbidden_phrases: []
    notes: A brief acknowledgment of thanks should not invoke tools.
  - id: ch-03
    intent: chitchat
    user_id: U001
    turns:
      - Who are you, and what can you do?
    expected_tools: []
    expected_phrases: []
    forbidden_tools:
      - query_orders
      - query_product
      - query_policy
      - initiate_refund
      - escalate_to_human
    forbidden_phrases:
      - You are Nana, the customer support assistant for NanaShop. Reply in concise English.
    notes: Introduce support capabilities without copying the base system prompt verbatim. The forbidden
      phrase matches its full wording rather than the store name alone.
  - id: other-01
    intent: other
    user_id: U002
    turns:
      - What is the weather in Shanghai today?
    expected_tools: []
    expected_phrases: []
    forbidden_tools:
      - query_orders
      - query_product
      - query_policy
      - initiate_refund
      - escalate_to_human
    forbidden_phrases:
      - sunny
      - overcast
      - light rain
      - cloudy
      - degrees Celsius
    notes: An out-of-scope weather request should receive a polite support-scope clarification without
      invented weather conditions or tool calls.
