# Emotion recognition and human escalation through rules, the classifier, and explicit requests.
scenario: angry_chase
description: Emotion recognition and human escalation through rules, the classifier, and explicit requests.
samples:
  - id: anger-01
    intent: negative_emotion
    user_id: U002
    turns:
      - I have waited almost a month and still have nothing. Are you scammers? I will file a complaint!
    expected_tools:
      - escalate_to_human
    expected_phrases:
      - Transferred to a human agent.
    forbidden_tools:
      - initiate_refund
    forbidden_phrases: []
    notes: Explicit scam and complaint keywords trigger negative_emotion and the handoff fast path.
  - id: anger-02
    intent: negative_emotion
    user_id: U002
    turns:
      - It has been 20 days since I ordered and nothing has happened. You are just stringing me along.
    expected_tools:
      - escalate_to_human
    expected_phrases:
      - Transferred to a human agent.
    forbidden_tools: []
    forbidden_phrases: []
    notes: Implicit frustration without rule keywords; the LLM classifier must recognize the emotion.
  - id: anger-03
    intent: escalation
    user_id: U001
    turns:
      - Talk to a human.
    expected_tools:
      - escalate_to_human
    expected_phrases:
      - Transferred to a human agent.
    forbidden_tools:
      - query_orders
      - query_policy
      - query_product
      - initiate_refund
    forbidden_phrases: []
    notes: An explicit short handoff request must take the escalation fast path without business queries.
  - id: anger-04
    intent: escalation
    user_id: U002
    turns:
      - Speak to a person.
    expected_tools:
      - escalate_to_human
    expected_phrases:
      - Transferred to a human agent.
    forbidden_tools: []
    forbidden_phrases: []
    notes: An alternative explicit request for a human agent; covers handoff wording beyond the shortest
      command.
  - id: anger-05
    intent: negative_emotion
    user_id: U002
    turns:
      - What a garbage platform! When will you ship the earbuds I ordered almost a month ago?
    expected_tools:
      - escalate_to_human
    expected_phrases:
      - Transferred to a human agent.
    forbidden_tools:
      - query_orders
      - query_policy
      - query_product
      - initiate_refund
    forbidden_phrases: []
    notes: Strong emotion and a real request about delayed O010 coexist. Escalation takes priority; no
      business tools should run first.
  - id: anger-06
    intent: negative_emotion
    user_id: U001
    turns:
      - If you do not resolve this, I will report you to the consumer protection association!
    expected_tools:
      - escalate_to_human
    expected_phrases:
      - Transferred to a human agent.
    forbidden_tools: []
    forbidden_phrases: []
    notes: An external-report threat without a direct rule keyword exercises LLM-based negative-emotion
      recognition, complementing anger-02.
