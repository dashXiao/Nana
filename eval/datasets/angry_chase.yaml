# 剧本 1：愤怒的催单客户
#
# 考察点：情绪识别 + 升级路径
# - 规则层（12 词正则）能命中最激烈的辱骂语
# - LLM 分类器能识别"长时间催单无辱骂词"的隐式情绪
# - 显式"转人工"三字直接 escalation 意图 fast_path
# 无论哪条命中，expected_tools 都应是 [escalate_to_human]，终答含"已转接人工"。
scenario: angry_chase
description: 情绪识别 + 升级路径；规则层 / LLM 分类器 / 显式转人工三条击中路径

samples:
  - id: anger-01
    intent: negative_emotion
    user_id: U002
    turns:
      - "我等了快一个月还没收到，你们骗子吗？投诉你们！"
    expected_tools: [escalate_to_human]
    expected_phrases: [已转接人工]
    forbidden_tools: [initiate_refund]
    forbidden_phrases: []
    notes: "规则层 12 词（骗子/投诉）直接命中 negative_emotion，走 fast_path。"

  - id: anger-02
    intent: negative_emotion
    user_id: U002
    turns:
      - "我下单 20 天了一点动静都没有，这是在糊弄人吧。"
    expected_tools: [escalate_to_human]
    expected_phrases: [已转接人工]
    forbidden_tools: []
    forbidden_phrases: []
    notes: "无辱骂词，但情绪隐式。依赖 LLM 分类器（规则层漏召回补刀用）。"

  - id: anger-03
    intent: escalation
    user_id: U001
    turns:
      - "转人工"
    expected_tools: [escalate_to_human]
    expected_phrases: [已转接人工]
    forbidden_tools: [query_orders, query_policy, query_product, initiate_refund]
    forbidden_phrases: []
    notes: "三字显式指令必须直接 escalation 意图 fast_path，不得先去查任何东西。"

  - id: anger-04
    intent: escalation
    user_id: U002
    turns:
      - "找真人"
    expected_tools: [escalate_to_human]
    expected_phrases: [已转接人工]
    forbidden_tools: []
    forbidden_phrases: []
    notes: "『找真人』同样是显式转人工意图（规则层负样本覆盖点）。"

  - id: anger-05
    intent: negative_emotion
    user_id: U002
    turns:
      - "你们这破平台！我那只下了快一个月的耳机到底什么时候发货？"
    expected_tools: [escalate_to_human]
    expected_phrases: [已转接人工]
    forbidden_tools: [query_orders, query_policy, query_product, initiate_refund]
    forbidden_phrases: []
    notes: |
      情绪 + 业务诉求混合：用户既辱骂（"破平台"在 12 词正则里）又有真实诉求（O010 久未发货）。
      架构选择是优先 fast_path 升级人工，不绕去查订单——这是 §9 决定"情绪命中即短路"
      的关键回归。forbidden_tools 强约束：不得在情绪触发后还去调业务工具"顺手解决"。

  - id: anger-06
    intent: negative_emotion
    user_id: U001
    turns:
      - "再不给我处理，我就向消协反映了！"
    expected_tools: [escalate_to_human]
    expected_phrases: [已转接人工]
    forbidden_tools: []
    forbidden_phrases: []
    notes: |
      升级关键词正则覆盖不全的负样本：12 词里只有"投诉"不含"消协/12315/工商局"。
      期望 LLM 分类器把这种"威胁外部投诉"识别为 negative_emotion 接住。
      和 anger-02（"糊弄人"无辱骂词）类似，但情绪信号位置不同——一个在隐式抱怨，
      一个在威胁话术——两条样本一起为 LLM 分类器画出独立信号。
